    <script>
      // Gracefully suppress Vite HMR WebSocket disconnect events in AI Studio sandboxed iframe
      const _origConsoleError = console.error;
      console.error = function () {
        for (let i = 0; i < arguments.length; i++) {
          const argStr = String(arguments[i]);
          if (argStr.indexOf('WebSocket') !== -1 || argStr.indexOf('[vite]') !== -1 || argStr.indexOf('vite') !== -1) {
            return;
          }
        }
        _origConsoleError.apply(console, arguments);
      };
      window.addEventListener('error', function (e) {
        const msg = (e && e.message) ? String(e.message) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        const reason = (e && e.reason) ? String(e.reason) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
